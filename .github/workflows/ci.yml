name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      skip_lint:
        description: '跳过代码检查阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_test:
        description: '跳过单元测试阶段'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime（actions/checkout, actions/setup-node 等）
  # 解决 "Node.js 20 actions are deprecated" 弃用警告
  # 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '20'
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
  IMAGE_NAME: acore-ranking
  # 前端构建参数 —— Vite 在编译时内联到静态 JS 中
  VITE_ICON_BASE_URL: ${{ vars.VITE_ICON_BASE_URL || 'https://wow.zamimg.com/images/wow/icons/medium' }}
  VITE_AOWOW_BASE_URL: ${{ vars.VITE_AOWOW_BASE_URL || 'https://wowgaming.altervista.org/aowow' }}
  VITE_WIDGET_DETAIL_URL: ${{ vars.VITE_WIDGET_DETAIL_URL || '' }}
  VITE_WIDGET_ONLINE_URL: ${{ vars.VITE_WIDGET_ONLINE_URL || '' }}

jobs:
  # ============================================================
  # Stage 1: 前端代码检查与构建
  # ============================================================
  frontend:
    name: Frontend / 前端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies / 安装依赖
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Generate app version / 生成应用版本号
        id: version
        run: |
          APP_VERSION=$(cat VERSION)
          echo "app_version=${APP_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: frontend
        run: npm test

      - name: Build / 构建
        working-directory: frontend
        env:
          VITE_ICON_BASE_URL: ${{ env.VITE_ICON_BASE_URL }}
          VITE_AOWOW_BASE_URL: ${{ env.VITE_AOWOW_BASE_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: npm run build

  # ============================================================
  # Stage 2: 后端代码检查与测试
  # ============================================================
  backend:
    name: Backend / 后端
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js / 安装 Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies / 安装依赖
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Lint / 代码检查
        if: github.event.inputs.skip_lint != 'true'
        working-directory: backend
        run: npm run lint

      - name: Type Check / 类型检查
        working-directory: backend
        run: npx tsc --noEmit

      # Dockerfile 静态检查放美国 runner（hadolint 无 darwin-arm64 原生版，构建机为 macOS）
      - name: Dockerfile Lint / Dockerfile 检查
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Test / 运行测试
        if: github.event.inputs.skip_test != 'true'
        working-directory: backend
        run: npm test

      - name: Build / 构建
        working-directory: backend
        run: npm run build

  # ============================================================
  # Stage 3: Docker 镜像构建与推送
  # ============================================================
  docker:
    name: Docker Build & Push / Docker 构建与推送
    runs-on: [self-hosted]
    needs: [frontend, backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 15
    outputs:
      # 只传不含密钥的片段:TCR 命名空间是 secret,整条镜像地址会被 GitHub 判为含密而丢弃输出
      image_tag: ${{ steps.image_info.outputs.image_tag }}
      image_digest: ${{ steps.image_info.outputs.image_digest }}

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4.2.2

      # 本机持久 builder（buildkitd 配国内 docker.io 镜像源 + 本地缓存跨 job 持久，见 ~/Workspace/actions-runner/buildkitd.toml）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      - name: Login to TCR / 登录腾讯云容器镜像服务
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Generate image tags / 生成镜像标签
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          APP_VERSION=$(cat VERSION)
          echo "sha_short=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and Push / 构建并推送
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.latest_tag }}
          build-args: |
            VITE_ICON_BASE_URL=${{ env.VITE_ICON_BASE_URL }}
            VITE_AOWOW_BASE_URL=${{ env.VITE_AOWOW_BASE_URL }}
            VITE_WIDGET_DETAIL_URL=${{ env.VITE_WIDGET_DETAIL_URL }}
            VITE_WIDGET_ONLINE_URL=${{ env.VITE_WIDGET_ONLINE_URL }}
            VITE_APP_VERSION=${{ steps.vars.outputs.app_version }}

      - name: Output image info / 输出镜像信息
        id: image_info
        run: |
          # 只输出不含密钥的片段:TCR 命名空间是 secret,含它的完整地址不能跨 job 传递
          # (GitHub 会以「可能含密」为由丢弃该输出,deploy job 拿到的会是空串)
          echo "image_tag=${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.sha_short }}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "Image pushed: ${{ steps.vars.outputs.image_tag }}"
          echo "Latest tag: ${{ steps.vars.outputs.latest_tag }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  # ============================================================
  # Stage 4: 部署到腾讯云 SCF
  #   develop → staging 命名空间(测试环境)
  #   main    → production 命名空间(生产环境)
  # 只换函数镜像,不动环境变量/端口/超时等其余配置(线上这些值是人工在控制台调过的)
  # ============================================================
  deploy-scf:
    name: Deploy to SCF / 部署腾讯云函数
    runs-on: [self-hosted]
    needs: [docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 15
    env:
      SCF_REGION: ${{ vars.SCF_REGION || 'ap-beijing' }}
      SCF_FUNCTION_NAME: ${{ vars.SCF_FUNCTION_NAME || 'acore-ranking' }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}

    steps:
      - name: Checkout / 检出代码
        uses: actions/checkout@v4.2.2

      # 分支 → 命名空间映射。两个环境各留一个 repo variable 覆盖口,
      # 但默认值必须是 staging/production,改错默认值等于把测试包发到生产。
      - name: Resolve target / 解析目标环境
        id: target
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            develop)
              namespace="${{ vars.SCF_STAGING_NAMESPACE || 'staging' }}"
              label="测试(staging)"
              ;;
            main)
              namespace="${{ vars.SCF_PRODUCTION_NAMESPACE || 'production' }}"
              label="生产(production)"
              ;;
            *)
              echo "::error::不支持的分支 $GITHUB_REF_NAME,拒绝部署"
              exit 1
              ;;
          esac
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          echo "目标环境: ${label}(命名空间 ${namespace})"

      # 不用 actions/setup-node:它从 github.com/actions/node-versions 下载 node,
      # 该域名在国内基本拉不动(实测卡到作业超时)。self-hosted runner 自带 node,直接用。
      - name: Install Dependencies / 安装依赖
        working-directory: scripts/deploy
        run: |
          node -v
          npm -v
          npm ci

      - name: Deploy / 部署(更新函数镜像)
        working-directory: scripts/deploy
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
          SCF_NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          set -euo pipefail
          # 镜像地址在此组装:TCR 命名空间是 secret,无法作为 job 输出跨 job 传递
          export SCF_IMAGE_URI="${REGISTRY}/${TCR_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}@${IMAGE_DIGEST}"
          echo "目标镜像: ${SCF_IMAGE_URI}"
          npm run deploy:scf
