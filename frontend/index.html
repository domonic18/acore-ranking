<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>泰坦之眼 · TitanEye</title>
    <script type="text/javascript">
      var aowow_tooltips = { "colorlinks": true, "iconizelinks": false, "renamelinks": false };
    </script>
    <!-- aowow 浮窗脚本放在第三方 CDN 上,实测加载 ~185ms。不加 defer 会阻塞 HTML 解析,
         把首屏(app bundle 的发现时机)一起拖住;defer 后执行顺序不变(仍在主 bundle 之前),
         但解析不再等待它。浮窗走 document 级 mouseover 委托,后渲染的链接同样生效。 -->
    <script type="text/javascript" defer src="https://wowgaming.altervista.org/aowow/static/widgets/power.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
